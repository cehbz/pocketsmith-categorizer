# Copy to ~/.config/pocketsmith-categorizer/config.toml and fill in.

# The PocketSmith developer key: a 1Password reference (op://...), read with a prompt, or the
# path of a file only its owner can read, for unattended runs.
key_ref = "op://VAULT/ITEM/FIELD"

# PocketSmith transaction account that carries the Grab charges.
account_id = 0

# Payees that mark a charge as Grab's.
payees = ["WWW.GRAB.COM", "GRABTAXI"]

# Label added to every charge the categorizer matches.
label = "grab-auto"

# PocketSmith category IDs.
[categories]
ride = 0
delivery = 0

# THB tip amounts; an unclaimed charge at one of them is a tip of that kind.
[tips]
ride = [60]
delivery = [20, 50]

# When a transaction needs your attention.
[attention]
start = "2026-01-01"   # transactions from this date on are judged even when they don't need review
large = 500            # an amount at least this large always needs attention
sd = 1                 # standard deviations above a payee's usual amount that need attention

# The monthly income check. Categories are PocketSmith category titles.
[income]
account = "Checking"       # the account Monthly Income arrives in
category = "Monthly Income"
bill = "Card Payment"      # the card bill paid from the account
rent = "Rent"
cash = "Cash"              # cash withdrawn from the account
target = 3000              # the balance the account is topped up to
tolerance = 1500           # how far a cycle may land from the estimate

# The trips layer. Categories are PocketSmith category titles.
[trips]
places = ["HOMETOWN", "HOME TOWN"]   # home places, as named in merchant names, payees and event locations
home_since = "2025-01-01"            # the home start: nothing before it is settled and no trip is inferred
home_airports = ["HMT"]              # home's airports: a flight from one leaves home, a flight to one returns
everywhere = ["GRAB"]                # always everywhere merchants, as word prefixes of the merchant

[trips.big]                          # each kind's Big subcategory
transport = "Trip Transport"
lodging = "Trip Lodging"
food = "Trip Food"
discretionary = "Trip Other"
cash = "Trip Cash"                   # cash withdrawn on a trip; the income estimate counts it as cash

[trips.home]                         # home categories with a kind, for charges without a merchant code
food = ["Groceries", "Restaurants"]
transport = ["Taxi"]
cash = ["Cash"]                      # withdrawals and ATM fee rebates on the income account

[trips.codes]                        # merchant category codes by kind; omit for these defaults
transport = ["3000-3299", "4111", "4112", "4121", "4131", "4411", "4511"]
lodging = ["3501-3999", "4722", "6513", "7011"]
food = ["5411", "5422", "5441", "5451", "5462", "5499", "5811-5814"]
booking = ["3000-3299", "3501-3999", "4112", "4411", "4511", "4722", "6513", "7011"]

# Plaid, for the card accounts' merchant names and codes. Each secret is a reference read as
# key_ref is; each account is its mask with the PocketSmith account it is.
[plaid]
client_id_ref = "/path/to/secrets/plaid-client-id"
secret_ref = "/path/to/secrets/plaid-secret"
access_token_ref = "/path/to/secrets/plaid-access-token"

[plaid.accounts]
"0000" = "Card"

# Google Calendar, for flights and stays. The OAuth client's id and secret are references read
# as key_ref is; categorize auth writes the token file, owner-only, and runs rewrite it when they
# refresh the token.
[calendar]
id = "someone@example.com"
client_id_ref = "/path/to/secrets/google-client-id"
client_secret_ref = "/path/to/secrets/google-client-secret"
token_ref = "/path/to/secrets/calendar-token.json"
