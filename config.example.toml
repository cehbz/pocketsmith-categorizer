# Copy to ~/.config/pocketsmith-categorizer/config.toml and fill in.

# 1Password reference to the PocketSmith developer key.
key_ref = "op://VAULT/ITEM/FIELD"

# PocketSmith transaction account that carries the Grab charges.
account_id = 0

# Payees that mark a charge as Grab's.
payees = ["WWW.GRAB.COM", "GRABTAXI"]

# Label added to every charge the categorizer matches.
label = "grab-auto"

# PocketSmith category IDs.
[categories]
ride = 0
delivery = 0

# THB tip amounts; an unclaimed charge at one of them is a tip of that kind.
[tips]
ride = [60]
delivery = [20, 50]
